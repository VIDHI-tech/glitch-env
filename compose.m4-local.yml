# Disposable local QA services. Keep separate from compose.media-dev.yml volumes.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: glitch
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: glitch_m4_qa
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - m4_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitch -d glitch_m4_qa"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: glitch_dev
      MINIO_ROOT_PASSWORD: local_dev_only_change_me
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - m4_media:/data
volumes:
  m4_pg:
  m4_media:
