name: CI

on:
  push:
    branches: [main, feat/m0-baseline-architecture, feat/m1-foundation, feat/m2-learning-engine, feat/m3-media-infrastructure, feat/m4-admin-course-builder, feat/m5-student-learning-experience]
  pull_request:

jobs:
  m1-and-legacy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: glitch_test
          POSTGRES_PASSWORD: glitch_test
          POSTGRES_DB: glitch_m1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glitch_test -d glitch_m1_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://glitch_test:glitch_test@127.0.0.1:5432/glitch_m1_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f compose.media-dev.yml config --quiet
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm m1:typecheck
      - run: pnpm m1:build
      - run: pnpm --filter @glitch/api test
      - run: pnpm test:m1:integration
      - run: pnpm test:m2:integration
      - run: pnpm test:m3:integration
      - run: pnpm test:m4:integration
      - run: pnpm test:m5:integration
      - run: npm run check
      - run: npm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  media-container-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: docker compose -f compose.media-dev.yml -f compose.media-ci.yml up --build -d --scale hls-worker=2
      - run: pnpm --filter @glitch/api exec tsx test/compose/media-e2e.ts
      - if: always()
        run: docker compose -f compose.media-dev.yml -f compose.media-ci.yml logs --no-color --tail=200
      - if: always()
        run: docker compose -f compose.media-dev.yml -f compose.media-ci.yml down -v --remove-orphans
  m4-m5-browser-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker compose -f compose.media-dev.yml -f compose.m4-qa.yml up --build -d
      - run: pnpm --filter @glitch/api exec tsx scripts/seed-m4-qa.ts
        env:
          M4_QA_SEED: '1'
          DATABASE_URL: postgresql://glitch:local_dev_only@127.0.0.1:55433/glitch_m4_qa
      - run: pnpm test:m4:e2e
      - run: pnpm test:m5:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-m5-browser-screenshots
          path: |
            docs/qa/m4-*.png
            docs/qa/m5-*.png
          if-no-files-found: ignore
      - if: always()
        run: docker compose -f compose.media-dev.yml -f compose.m4-qa.yml logs --no-color --tail=150
      - if: always()
        run: docker compose -f compose.media-dev.yml -f compose.m4-qa.yml down -v --remove-orphans
